<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LabML — train machine learning models on your own data, entirely in your browser. Nothing leaves your machine."
    />
    <meta name="theme-color" content="#0b6e5d" />
    <title>LabML</title>
    <!-- Anti-flash theme boot, inlined; its sha256 hash is allow-listed in the CSP. -->
    <script>(function(){try{var s=localStorage.getItem('labml-theme');var d=s==='dark'||(s!=='light'&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d)}catch(e){}})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

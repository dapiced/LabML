name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production and development dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # V49 — the same suite, with a coverage floor (see vite.config.ts).
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7

  workflows:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # V49 — a static audit of these workflows: template injection, unpinned
      # or impostor action commits, credentials left on disk, over-broad
      # permissions. Pinned by version and installed from PyPI rather than
      # through a third-party action, so the auditor is not itself an
      # unpinned dependency. The token lets the online audits check that each
      # pinned SHA really belongs to the action's repository.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx run --spec zizmor==1.30.1 zizmor --format=github .github/workflows

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    needs: quality
    runs-on: ubuntu-latest
    # Informational for now — scores on shared runners are noisy.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # V35 — this job died on `npm ci` with ETIMEDOUT reaching a Microsoft CDN.
      # The same `npm ci`, same commit, same lockfile, succeeded in the two
      # other jobs of that run, so it was the network rather than the tree —
      # and neither the lockfile's integrity hashes nor npm's retries cover the
      # network call an install script makes on its own.
      #
      # What that call fetches, measured: `onnxruntime-node` ships its base
      # binaries inside the tarball, and its postinstall downloads three more —
      # `libonnxruntime_providers_cuda.so` (301 MB), `_tensorrt.so` and
      # `_shared.so`. They are GPU execution providers. LabML runs its models in
      # the browser and never loads the Node binding at all, so this job was
      # spending 302 MB, and a point of failure, on CUDA libraries nothing here
      # can use. Skipping scripts takes the package from 514 MB to 212 MB.
      #
      # Nothing else is lost. Eight packages have install scripts — the two
      # above plus esbuild, workerd, protobufjs and fsevents ×3 — and none is
      # reachable from `@lhci/cli`. Chrome is not among them either: the chain
      # runs through `puppeteer-core`, which never downloads a browser, so
      # Lighthouse already used the runner's own Chrome. Verified locally: a
      # `--ignore-scripts` install (33 s) runs `lhci autorun` to completion,
      # « Chrome installation found », all assertions passing.
      #
      # `quality`, `e2e` and `deploy` keep their scripts: they need esbuild to
      # build and workerd to deploy.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: npx lhci autorun
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouse
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [quality, e2e]
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # V27: the local language model (355 MB) is fetched and split here, not
      # committed — 355 MB of binaries in git would slow every clone and every
      # checkout, for weights only the opt-in chat engine downloads. The script
      # verifies each file's size and fails loudly rather than shipping a
      # truncated model.
      # V41.1 — Hugging Face rate-limits shared runner IPs (HTTP 429). The
      # sharded model is cached, keyed on the script that pins it, so a normal
      # deploy never touches Hugging Face; a miss retries with backoff and uses
      # the optional HF_TOKEN secret to lift the anonymous limit.
      - name: Cache the sharded language model
        id: llm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/llm
          key: llm-sharded-${{ hashFiles('scripts/prepare-llm.mjs') }}
      - name: Fetch and shard the local language model
        if: steps.llm.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: npm run llm:prepare -- dist/llm
      - name: Ensure the Pages project exists
        run: npx wrangler pages project create labml --production-branch=main || true
      # V49 — the branch name reaches the shell through the environment, never
      # through template expansion: `${{ }}` is pasted into the script before
      # bash parses it, so a branch named `x";curl …;"` would have run as code.
      - name: Deploy
        env:
          DEPLOY_BRANCH: ${{ github.event_name == 'push' && 'main' || github.head_ref }}
        run: npx wrangler pages deploy dist --project-name=labml --branch="$DEPLOY_BRANCH"

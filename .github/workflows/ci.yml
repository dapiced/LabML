name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    needs: quality
    runs-on: ubuntu-latest
    # Informational for now — scores on shared runners are noisy.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # V35 — this job died on `npm ci` with ETIMEDOUT reaching a Microsoft CDN.
      # The same `npm ci`, same commit, same lockfile, succeeded in the two
      # other jobs of that run, so it was the network rather than the tree —
      # and neither the lockfile's integrity hashes nor npm's retries cover the
      # network call an install script makes on its own.
      #
      # What that call fetches, measured: `onnxruntime-node` ships its base
      # binaries inside the tarball, and its postinstall downloads three more —
      # `libonnxruntime_providers_cuda.so` (301 MB), `_tensorrt.so` and
      # `_shared.so`. They are GPU execution providers. LabML runs its models in
      # the browser and never loads the Node binding at all, so this job was
      # spending 302 MB, and a point of failure, on CUDA libraries nothing here
      # can use. Skipping scripts takes the package from 514 MB to 212 MB.
      #
      # Nothing else is lost. Eight packages have install scripts — the two
      # above plus esbuild, workerd, protobufjs and fsevents ×3 — and none is
      # reachable from `@lhci/cli`. Chrome is not among them either: the chain
      # runs through `puppeteer-core`, which never downloads a browser, so
      # Lighthouse already used the runner's own Chrome. Verified locally: a
      # `--ignore-scripts` install (33 s) runs `lhci autorun` to completion,
      # « Chrome installation found », all assertions passing.
      #
      # `quality`, `e2e` and `deploy` keep their scripts: they need esbuild to
      # build and workerd to deploy.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx lhci autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouse
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [quality, e2e]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # V27: the local language model (355 MB) is fetched and split here, not
      # committed — 355 MB of binaries in git would slow every clone and every
      # checkout, for weights only the opt-in chat engine downloads. The script
      # verifies each file's size and fails loudly rather than shipping a
      # truncated model.
      - name: Fetch and shard the local language model
        run: npm run llm:prepare -- dist/llm
      - name: Ensure the Pages project exists
        run: npx wrangler pages project create labml --production-branch=main || true
      - name: Deploy
        run: npx wrangler pages deploy dist --project-name=labml --branch="${{ github.event_name == 'push' && 'main' || github.head_ref }}"

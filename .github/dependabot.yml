version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Toronto
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '@duckdb/duckdb-wasm'
        versions:
          - '>=1.29.0'
      - dependency-name: '@huggingface/transformers'
        versions:
          - '>=4.3.0 <4.4.0'
      # V52.3: TypeScript 7 typechecks this code with 0 errors, but
      # typescript-eslint 8.71.1 only supports TypeScript <6.1. Lift this when
      # it does; until then a weekly PR would only fail the lint.
      - dependency-name: typescript
        versions:
          - '>=7.0.0'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:30'
      timezone: America/Toronto
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
